name: Desktop builds

# Produces installable Windows desktop versions of Hiwar.
#  • Push to main or run manually → artifacts are attached to the run
#  • Push a tag like v2.0.0          → a GitHub Release is published
on:
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "package.json"
      - "index.html"
      - "js/**"
      - "css/**"
      - "icons/**"
      - "fonts/**"
      - "manifest.json"
      - "sw.js"
      - "build/**"
      - ".github/workflows/desktop.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (installer + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify app before packaging
        run: node scripts/check.js

      - name: Build Windows app
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hiwar-windows
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Hiwar ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest.yml
